<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">

        <title>
            {% block title%}FirstRep{% endblock %}
        </title>
        <link
            rel = "stylesheet"
            href="{{url_for('static', filename='style.css')}}"
        >
    </head>
    <body class = "{% block body_class %}{% endblock %}">
        <header>
            <nav>
                <a href="{{ url_for('main.home') }}">FirstRep</a>
                <button
                    type="button"
                    id="theme-toggle"
                    class="theme-toggle"
                    aria-label="Switch to dark mode"
                    aria-pressed="false"
                    >
                    Dark mode
                </button>
            </nav>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
        <script src="{{ url_for('static', filename='theme.js') }}"></script>
    </body>
</html>
